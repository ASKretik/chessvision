# Render blueprint (E.1). Free tier: 750 h/mo, 512 MB, sleeps after 15 min
# idle with a ~60 s wake. Upgrade path if E.3 profiling fails: plan: starter.
services:
  - type: web
    name: chess-analysis-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      # E.3 knobs. Raise MEMORY_BUDGET_MB to 2048 if you move to Starter.
      - key: STOCKFISH_HASH_MB
        value: "16"
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: MEMORY_BUDGET_MB
        value: "512"
      - key: MEMORY_HEADROOM_MB
        value: "64"
      - key: MAIA2_PRELOAD
        value: "1"
      - key: LLM_PROVIDER
        value: groq
      - key: MAX_COMMENTS_PER_GAME
        value: "18"
      - key: RATE_LIMIT_PER_HOUR
        value: "20"
      # Set in the Render dashboard, never committed (E.5).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
