# Builds the frontend and publishes it to GitHub Pages on every push to main.
# Pages hosts static files only: the landing page works fully, while the app
# pages need the Python backend (see render.yaml). Set the repository variable
# VITE_API_BASE to that backend's URL to connect them.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b && npx vite build --outDir dist
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      # SPA fallback: Pages serves 404.html for deep links like /analyse.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
