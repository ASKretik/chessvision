<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChessVision — Game analysis for serious improvers</title>
    <meta name="description" content="ChessVision turns any chess game into a coaching report: engine analysis, accuracy, rating estimates and written explanations." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%235b5bf6%22/%3E%3Cpath d=%22M6 16s4-7 10-7 10 7 10 7-4 7-10 7S6 16 6 16z%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222.2%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%223.4%22 fill=%22white%22/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
    />
    <script>
      // Resolve the theme BEFORE first paint, or the page flashes dark-then-light.
      // Three states: 'dark' | 'light' | 'system'. Storage can throw in a
      // private window, so every access is guarded and dark is the fallback.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('chess.theme');
        } catch (e) {
          /* blocked storage: fall through to dark */
        }
        var resolved =
          stored === 'light' || stored === 'dark'
            ? stored
            : stored === 'system' &&
                window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        document.documentElement.setAttribute('data-theme', resolved);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
