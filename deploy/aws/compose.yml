# ChessVision API on a single EC2 instance (t3.small: 2 vCPU, 2 GB).
#
#   api    the same Docker image Render builds, in demo mode, with the
#          accounts database on a named volume so it survives restarts
#   caddy  HTTPS in front of it, with a free Let's Encrypt certificate for
#          the DuckDNS name. GitHub Pages is https, so the API must be too.
#
# Secrets live in deploy/aws/.env (gitignored), written by bootstrap.sh.
services:
  api:
    build:
      context: ../..
      args:
        MAIA2_ONNX_URL: https://github.com/ASKretik/chessvision/releases/download/maia2-rapid-v1/maia2.onnx
        MAIA2_ONNX_SHA256: 7b46936e13ae0adb8758805f983b2161e7de9ee48c4eb63c626e3cb682b0b655
    restart: unless-stopped
    # Leaves ~450 MB for the OS, Docker and Caddy. The server reads this
    # limit from its cgroup and refuses jobs before it is OOM-killed.
    mem_limit: 1536m
    environment:
      ENV: demo
      FRONTEND_ORIGIN: https://askretik.github.io
      ACCOUNTS_DB: /app/state/app.db
      LLM_PROVIDER: groq
      LLM_API_KEY: ${LLM_API_KEY:-}
      MEMORY_BUDGET_MB: "1536"
      MEMORY_HEADROOM_MB: "128"
      STOCKFISH_HASH_MB: "64"
      STOCKFISH_THREADS: "1"
      MAX_CONCURRENT_JOBS: "2"
      MAX_COMMENTS_PER_GAME: "18"
      RATE_LIMIT_PER_HOUR: "20"
    volumes:
      - state:/app/state

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/aws/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  state:
  caddy_data:
  caddy_config:
